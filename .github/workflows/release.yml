name: Release

# v* 태그를 푸시하면 macOS(DMG)·Windows(MSI) 설치 파일을 만들어 GitHub 릴리즈에 붙인다.
# 태그는 gradle.properties 의 switchboard.version 과 같아야 앱 안의 업데이트 확인이 어긋나지 않는다.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    name: 패키징 (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            task: packageMacDmg
            glob: app/build/compose/binaries/main/dmg/*.dmg
          - os: windows-latest
            task: packageWindowsZip
            glob: app/build/compose/binaries/main/zip/*.zip
    env:
      MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: 태그와 버전이 같은지 확인
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          version=$(grep '^switchboard.version=' gradle.properties | cut -d= -f2)
          tag=${GITHUB_REF_NAME#v}
          [ "$version" = "$tag" ] || { echo "gradle.properties 의 버전($version)과 태그($tag)가 달라요"; exit 1; }
      - name: 테스트
        run: ./gradlew test --console=plain
      # 인증서와 공증 정보가 저장소 시크릿에 있으면 서명·공증한다. 없으면 서명 없이 만든다
      - name: macOS 서명 준비
        if: runner.os == 'macOS' && env.MACOS_CERTIFICATE_P12 != ''
        env:
          MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          NOTARY_APPLE_ID: ${{ secrets.NOTARY_APPLE_ID }}
          NOTARY_TEAM_ID: ${{ secrets.NOTARY_TEAM_ID }}
          NOTARY_PASSWORD: ${{ secrets.NOTARY_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/switchboard.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          echo "$MACOS_CERTIFICATE_P12" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security import "$RUNNER_TEMP/certificate.p12" -k "$KEYCHAIN" -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          rm -f "$RUNNER_TEMP/certificate.p12"
          # 서명할 때 암호를 묻지 않게 한다 (러너에는 사람이 없다)
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN" login.keychain-db
          xcrun notarytool store-credentials "SwitchboardNotary" \
            --apple-id "$NOTARY_APPLE_ID" --team-id "$NOTARY_TEAM_ID" --password "$NOTARY_PASSWORD" --keychain "$KEYCHAIN"
          IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN" | sed -n 's/.*"Developer ID Application: \(.*\)"/\1/p' | head -1)
          [ -n "$IDENTITY" ] || { echo "키체인에서 Developer ID Application 인증서를 찾지 못했어요"; exit 1; }
          echo "SWITCHBOARD_SIGNING_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"
          echo "SWITCHBOARD_NOTARY_KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"
          echo "서명 신원: $IDENTITY"

      - name: 설치 파일 만들기
        run: ./gradlew :app:${{ matrix.task }} --console=plain

      - name: 서명 확인 (macOS)
        if: runner.os == 'macOS' && env.SWITCHBOARD_SIGNING_IDENTITY != ''
        run: spctl -a -vv -t install app/build/compose/binaries/main/dmg/*.dmg

      - name: 키체인 정리
        if: always() && runner.os == 'macOS'
        run: |
          security list-keychains -d user -s login.keychain-db || true
          security delete-keychain "$RUNNER_TEMP/switchboard.keychain-db" || true
      - name: jpackage 로그
        if: failure()
        shell: bash
        run: for f in app/build/compose/logs/*/*.txt; do echo "=== $f"; cat "$f"; done
      - uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.os }}
          path: ${{ matrix.glob }}

  release:
    name: 릴리즈 올리기
    needs: package
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: installers
          merge-multiple: true
      - name: 파일 이름 고정 (releases/latest/download/... 링크가 늘 최신을 가리키게)
        run: |
          ls -R installers
          cd installers
          # DMG 는 한글 버전 이름으로 올라오고, zip 은 이미 최종 이름이다. 같은 이름이면 그대로 둔다
          rename() { [ "$1" = "$2" ] || mv "$1" "$2"; }
          rename "$(ls *.dmg)" Switchboard.dmg
          rename "$(ls *.zip)" Switchboard-windows.zip
          cd ..
          # 앱이 zip 을 받아 스스로 설치하기 전에 이 값으로 무결성을 확인한다 (Windows 빌드는 서명이 없다)
          cd installers && sha256sum Switchboard.dmg Switchboard-windows.zip > SHA256SUMS.txt && cat SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            installers/Switchboard.dmg
            installers/Switchboard-windows.zip
            installers/SHA256SUMS.txt
          generate_release_notes: true
