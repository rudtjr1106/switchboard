name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    name: 테스트 (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: 테스트
        run: ./gradlew test --console=plain
      - name: 배포본 생성 (설치 파일 없이)
        run: ./gradlew :app:createDistributable --console=plain
