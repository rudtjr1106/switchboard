org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
kotlin.code.style=official

# 앱 버전. 릴리즈 태그(v1.0.0)와 맞춘다. macOS jpackage 는 첫 자리가 0 이면 거부하므로 1 부터 시작한다. GitHub Actions 는 이 값으로 태그와 설치 파일을 만든다
switchboard.version=1.0.1

# GitHub OAuth App(Switchboard) 의 Client ID. Device Flow 로그인에 쓴다
# 비밀값이 아니다(Device Flow 는 client secret 을 쓰지 않는다). 모든 사용자가 이 앱으로 자기 계정에 로그인한다
switchboard.githubClientId=Ov23lilVzkD9hytJNmIO
