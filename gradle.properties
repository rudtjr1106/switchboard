org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
kotlin.code.style=official

# 앱 버전. 릴리즈 태그(v1.0.0)와 맞춘다. macOS jpackage 는 첫 자리가 0 이면 거부하므로 1 부터 시작한다. GitHub Actions 는 이 값으로 태그와 설치 파일을 만든다
switchboard.version=1.0.0

# GitHub OAuth App 의 Client ID (Device Flow 활성화 필요). 비어 있으면 앱 설정 화면에서 입력받는다
switchboard.githubClientId=
